name: Deploy

# Builds and publishes the static frontend to S3 + CloudFront on every push
# to main. Separate from test.yml, which already gates PRs — this only runs
# post-merge, and assumes branch protection requires test.yml's checks to
# pass before a PR can merge. Provisioning (the bucket, distribution, and
# this workflow's deploy role) is one-time and manual — see deploy/provision.sh
# and docs/DEPLOYMENT.md; nothing here creates AWS resources, only pushes
# built files into ones that already exist.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-deploy without a new commit

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a deploy mid-sync

env:
  NODE_VERSION: '20'
  AWS_REGION: il-central-1

permissions:
  id-token: write # required for OIDC AssumeRoleWithWebIdentity
  contents: read

jobs:
  deploy:
    name: Build & deploy to S3/CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          VITE_SRV_BASE_URL: ${{ vars.VITE_SRV_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET_NAME }}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html itself must never be long-cached (it's what picks up
          # every new deploy's hashed asset filenames) — re-sync it with a
          # short/no-cache header, matching a standard Vite-SPA-on-S3 setup.
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET_NAME }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
